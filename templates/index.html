<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interface simple pour gérer des demandes de rénovation EcoReno" />
    <title>EcoReno</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f8f5;
        --panel: #ffffff;
        --text: #163126;
        --muted: #5f7a6d;
        --accent: #2f7d5b;
        --accent-dark: #215c43;
        --border: #dbe8e0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(22,49,38,0.06);
      }
      h1 { margin: 0 0 8px; }
      p { margin: 0; color: var(--muted); }
      .grid {
        display: grid;
        gap: 24px;
        grid-template-columns: 1.1fr 0.9fr;
        margin-top: 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }
      form { display: grid; gap: 12px; }
      label { font-weight: 600; }
      input, select, textarea, button {
        width: 100%;
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover { background: var(--accent-dark); }
      .demande-list { display: grid; gap: 12px; }
      .demande-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: #fbfdfb;
      }
      .muted { color: var(--muted); font-size: 0.95rem; }
      @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; }
        .page { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1>EcoReno</h1>
        <p>Suivez vos demandes de rénovation écologique avec une interface simple et accessible.</p>
      </header>

      <section class="grid" aria-label="Gestion des demandes">
        <div class="card">
          <h2>Créer une demande</h2>
          <form id="demande-form">
            <label for="name">Nom de la demande</label>
            <input id="name" name="name" required />

            <label for="owner">Nom du client</label>
            <input id="owner" name="owner" required />

            <label for="budget">Budget</label>
            <input id="budget" name="budget" type="number" min="1" required />

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"></textarea>

            <label for="status">Statut</label>
            <select id="status" name="status">
              <option value="PLANNED">Planifié</option>
              <option value="IN_PROGRESS">En cours</option>
              <option value="COMPLETED">Terminé</option>
            </select>

            <button type="submit">Ajouter</button>
          </form>
        </div>

        <div class="card">
          <h2>Demandes récentes</h2>
          <div id="demande-list" class="demande-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script>
      const list = document.getElementById('demande-list');
      const form = document.getElementById('demande-form');

      async function loadDemandes() {
        const response = await fetch('/api/demandes/');
        const demandes = await response.json();
        list.innerHTML = '';

        if (!demandes.length) {
          list.innerHTML = '<p class="muted">Aucune demande pour le moment.</p>';
          return;
        }

        demandes.forEach((demande) => {
          const item = document.createElement('article');
          item.className = 'demande-item';
          item.innerHTML = `
            <h3>${demande.name}</h3>
            <p class="muted">Client : ${demande.owner}</p>
            <p>Budget : ${demande.budget} €</p>
            <p>Description : ${demande.description || 'À compléter'}</p>
            <p>Statut : ${demande.status || 'PLANNED'}</p>
          `;
          list.appendChild(item);
        });
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(form).entries());
        payload.budget = Number(payload.budget);

        const response = await fetch('/api/demandes/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          form.reset();
          loadDemandes();
        }
      });

      loadDemandes();
    </script>
  </body>
</html>
